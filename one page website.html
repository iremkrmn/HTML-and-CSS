<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        nav {
            background: #333;
            padding: 10px;
            position: sticky;
            top: 0;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        section {
            padding: 40px;
        }

        .gallery img {
            width: 200px;
            height: 150px;
            margin: 10px;
            object-fit: cover;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        form input, form textarea {
            display: block;
            margin-bottom: 10px;
            width: 100%;
            max-width: 400px;
            padding: 8px;
        }
    </style>
</head>

<body>

<!-- NAVIGATION -->
<nav>
    <a href="#home">Home</a>
    <a href="#gallery">Images</a>
    <a href="#video">Video</a>
    <a href="#contact">Contact</a>
</nav>

<!-- HOME SECTION -->
<section id="home">
    <h1>Welcome to My One Page Website</h1>
    <p>This is a simple example of a one-page HTML website with multiple sections.</p>
</section>

<!-- IMAGE GALLERY SECTION -->
<section id="gallery">
    <h2>Image Gallery</h2>
    <div class="gallery">
        <img src="https://picsum.photos/300/200?random=1" alt="Image 1">
        <img src="https://picsum.photos/300/200?random=2" alt="Image 2">
        <img src="https://picsum.photos/300/200?random=3" alt="Image 3">
    </div>
</section>

<!-- VIDEO SECTION -->
<section id="video">
    <h2>Featured Video</h2>
    <iframe width="560" height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>
</section>

<!-- CONTACT SECTION -->
<section id="contact">
    <h2>Contact Me</h2>
    <form>
        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Message:</label>
        <textarea name="message" rows="5" required></textarea>

        <input type="submit" value="Send Message">
    </form>
</section>

<!-- FOOTER -->
<footer>
    <p>&copy; 2026 My One Page Website</p>
</footer>

</body>
</html>
